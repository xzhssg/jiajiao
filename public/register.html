<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>注册 - 家教匹配系统</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      background: #f0f2f5;
      color: #333;
      min-height: 100vh;
    }

    .navbar {
      background: linear-gradient(135deg, #1a237e, #3949ab);
      color: #fff;
      display: flex;
      align-items: center;
      padding: 0 24px;
      height: 56px;
    }

    .navbar a {
      color: rgba(255, 255, 255, .8);
      text-decoration: none;
      font-size: 14px;
      padding: 8px 14px;
      border-radius: 6px;
    }

    .navbar a:hover {
      background: rgba(255, 255, 255, .18);
    }

    .navbar .brand {
      font-size: 18px;
      font-weight: 700;
      margin-right: 32px;
    }

    .container {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: calc(100vh - 56px);
      padding: 24px;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, .1);
      padding: 28px;
      width: 100%;
      max-width: 480px;
    }

    .card h2 {
      font-size: 20px;
      margin-bottom: 20px;
      text-align: center;
      color: #1a237e;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }

    .form-group.full {
      grid-column: 1/-1;
    }

    .form-group label {
      font-size: 13px;
      font-weight: 500;
      color: #555;
      margin-bottom: 4px;
    }

    .form-group label .req {
      color: #e53935;
    }

    .form-group input,
    .form-group select {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid #d0d0d0;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
      transition: border-color .2s;
    }

    .form-group input:focus,
    .form-group select:focus {
      border-color: #3949ab;
      box-shadow: 0 0 0 3px rgba(57, 73, 171, .12);
    }

    .form-group .error-msg {
      font-size: 12px;
      color: #e53935;
      min-height: 18px;
      margin-top: 2px;
    }

    .btn {
      width: 100%;
      padding: 11px;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      cursor: pointer;
      transition: opacity .2s;
      margin-top: 8px;
    }

    .btn-primary {
      background: #3949ab;
      color: #fff;
    }

    .btn-primary:hover {
      opacity: .9;
    }

    .link {
      text-align: center;
      font-size: 13px;
      color: #777;
      margin-top: 12px;
    }

    .link a {
      color: #3949ab;
      text-decoration: none;
    }
  </style>
</head>

<body>
  <nav class="navbar">
    <div class="brand">📚 家教匹配系统</div><a href="./index.html">← 返回首页</a>
  </nav>
  <div class="container">
    <div class="card">
      <h2>注册新账号</h2>
      <div class="form-grid">
        <div class="form-group full"><label>用户名 <span class="req">*</span></label><input id="regUser"
            placeholder="4-20位字母或数字">
          <div class="error-msg" id="regUserErr"></div>
        </div>
        <div class="form-group"><label>密码 <span class="req">*</span></label><input type="password" id="regPwd"
            placeholder="至少6位">
          <div class="error-msg" id="regPwdErr"></div>
        </div>
        <div class="form-group"><label>确认密码 <span class="req">*</span></label><input type="password" id="regPwd2"
            placeholder="再次输入">
          <div class="error-msg" id="regPwd2Err"></div>
        </div>
        <div class="form-group"><label>昵称 <span class="req">*</span></label><input id="regNick" placeholder="显示名称">
          <div class="error-msg" id="regNickErr"></div>
        </div>
        <div class="form-group"><label>手机号 <span class="req">*</span></label><input id="regPhone" placeholder="11位手机号">
          <div class="error-msg" id="regPhoneErr"></div>
        </div>
        <div class="form-group full"><label>角色 <span class="req">*</span></label><select id="regRole">
            <option value="">请选择</option>
            <option value="student">学生（提供家教）</option>
            <option value="parent">家长（寻找家教）</option>
          </select>
          <div class="error-msg" id="regRoleErr"></div>
        </div>
      </div>
      <div id="regMsg" class="error-msg" style="margin-top:4px;"></div>
      <button class="btn btn-primary" onclick="doRegister()">注 册</button>
      <div class="link">已有账号？<a href="./login.html">去登录</a></div>
    </div>
  </div>
  <script>
    async function doRegister() {
      ['regUserErr', 'regPwdErr', 'regPwd2Err', 'regNickErr', 'regPhoneErr', 'regRoleErr'].forEach(id => document.getElementById(id).textContent = '');
      document.getElementById('regMsg').textContent = '';
      const user = document.getElementById('regUser').value.trim(); const pwd = document.getElementById('regPwd').value; const pwd2 = document.getElementById('regPwd2').value; const nick = document.getElementById('regNick').value.trim(); const phone = document.getElementById('regPhone').value.trim(); const role = document.getElementById('regRole').value;
      let ok = true;
      if (!user || user.length < 4 || user.length > 20 || !/^[a-zA-Z0-9_]+$/.test(user)) { document.getElementById('regUserErr').textContent = '4-20位字母数字下划线'; ok = false; }
      if (!pwd || pwd.length < 6) { document.getElementById('regPwdErr').textContent = '至少6位'; ok = false; }
      if (pwd !== pwd2) { document.getElementById('regPwd2Err').textContent = '两次密码不一致'; ok = false; }
      if (!nick) { document.getElementById('regNickErr').textContent = '请输入昵称'; ok = false; }
      if (!phone || !/^1\d{10}$/.test(phone)) { document.getElementById('regPhoneErr').textContent = '11位手机号格式错误'; ok = false; }
      if (!role) { document.getElementById('regRoleErr').textContent = '请选择角色'; ok = false; }
      if (!ok) return;
      try { const r = await fetch('/api/auth/register', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: user, password: pwd, role, nickname: nick, phone }) }); const d = await r.json(); if (d.ok) { alert('注册成功！请登录'); location.href = './login.html'; } else { document.getElementById('regMsg').textContent = d.msg; } } catch (e) { document.getElementById('regMsg').textContent = '网络错误'; }
    }
  </script>
</body>

</html>
