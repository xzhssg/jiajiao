<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>登录 - 家教匹配系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
            background: #f0f2f5;
            color: #333;
            min-height: 100vh;
        }

        .navbar {
            background: linear-gradient(135deg, #1a237e, #3949ab);
            color: #fff;
            display: flex;
            align-items: center;
            padding: 0 24px;
            height: 56px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .2);
        }

        .navbar a {
            color: rgba(255, 255, 255, .8);
            text-decoration: none;
            font-size: 14px;
            padding: 8px 14px;
            border-radius: 6px;
        }

        .navbar a:hover {
            background: rgba(255, 255, 255, .18);
        }

        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: calc(100vh - 56px);
            padding: 20px;
        }

        .card {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, .1);
            padding: 32px;
            width: 100%;
            max-width: 400px;
        }

        .card h2 {
            font-size: 20px;
            margin-bottom: 20px;
            text-align: center;
            color: #1a237e;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #555;
            margin-bottom: 4px;
        }

        .form-group input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #d0d0d0;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            transition: border-color .2s;
        }

        .form-group input:focus {
            border-color: #3949ab;
            box-shadow: 0 0 0 3px rgba(57, 73, 171, .12);
        }

        .btn {
            width: 100%;
            padding: 11px;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            cursor: pointer;
            transition: opacity .2s;
            margin-bottom: 10px;
        }

        .btn-primary {
            background: #3949ab;
            color: #fff;
        }

        .btn-primary:hover {
            opacity: .9;
        }

        .btn-outline {
            background: transparent;
            border: 1px solid #ccc;
            color: #555;
        }

        .btn-outline:hover {
            background: #f5f5f5;
        }

        .error-msg {
            color: #e53935;
            font-size: 13px;
            text-align: center;
            min-height: 20px;
            margin-bottom: 8px;
        }

        .link {
            text-align: center;
            font-size: 13px;
            color: #777;
        }

        .link a {
            color: #3949ab;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <nav class="navbar">
        <div style="font-size:18px;font-weight:700;margin-right:32px;">📚 家教匹配系统</div><a href="./index.html">← 返回首页</a>
    </nav>
    <div class="container">
        <div class="card">
            <h2>用户登录</h2>
            <div class="error-msg" id="err"></div>
            <div class="form-group"><label>用户名</label><input id="username" placeholder="请输入用户名"></div>
            <div class="form-group"><label>密码</label><input type="password" id="password" placeholder="请输入密码"></div>
            <button class="btn btn-primary" onclick="doLogin()">登 录</button>
            <div class="link">还没有账号？<a href="./register.html">立即注册</a></div>
        </div>
    </div>
    <script>
        async function doLogin() { const u = document.getElementById('username').value.trim(); const p = document.getElementById('password').value; const err = document.getElementById('err'); if (!u || !p) { err.textContent = '请输入用户名和密码'; return; } err.textContent = ''; try { const r = await fetch('/api/auth/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: u, password: p }) }); const d = await r.json(); if (d.ok) { location.href = './index.html'; } else { err.textContent = d.msg; } } catch (e) { err.textContent = '网络错误'; } }
    </script>
</body>

</html>
